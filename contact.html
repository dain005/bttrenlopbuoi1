<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniShop - Liên hệ</title>
</head>
<body>
    <header>
        <h1>MiniShop</h1>
        <p>Cửa hàng công nghệ dành cho sinh viên</p>
        <nav>
            <a href="index.html">Trang chủ</a> |
            <a href="about.html">Giới thiệu</a> |
            <a href="product.html">Sản phẩm</a> |
            <a href="register.html">Đăng ký</a> |
            <a href="login.html">Đăng nhập</a> |
            <a href="cart.html">Giỏ hàng</a> |
            <a href="contact.html">Liên hệ</a>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Liên hệ</h2>
        <form class="form">
            <p>
                <label for="name">Họ và tên:</label><br>
                <input type="text" id="name" name="name" required>
            </p>

            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="subject">Tiêu đề:</label><br>
                <input type="text" id="subject" name="subject" required>
            </p>

            <p>
                <label for="message">Nội dung:</label><br>
                <textarea id="message" name="message" rows="5" cols="40" required></textarea>
            </p>

            <button type="submit">Gửi</button>
        </form>
    </main>

    <hr>

    <footer>
        <p><strong>MiniShop</strong> - Cửa hàng công nghệ dành cho sinh viên</p>
        <p>Email: minishop@gmail.com | Hotline: 0123 456 789</p>
    </footer>
</body>
</html>
