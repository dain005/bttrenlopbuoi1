<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniShop - Đăng nhập</title>
</head>
<body>
    <header>
        <h1>MiniShop</h1>
        <p>Cửa hàng công nghệ dành cho sinh viên</p>
        <nav>
            <a href="index.html">Trang chủ</a> |
            <a href="about.html">Giới thiệu</a> |
            <a href="product.html">Sản phẩm</a> |

            <a href="cart.html">Giỏ hàng</a> |
            <a href="contact.html">Liên hệ</a>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Đăng nhập</h2>
        <form class="form">
            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="password">Mật khẩu:</label><br>
                <input type="password" id="password" name="password" required>
            </p>

            <p>
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Ghi nhớ đăng nhập</label>
            </p>

            <button type="submit">Đăng nhập</button>
        </form>
        <p>Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
    </main>

    <hr>

    <footer>
        <p><strong>MiniShop</strong> - Cửa hàng công nghệ dành cho sinh viên</p>
        <p>Email: minishop@gmail.com | Hotline: 0123 456 789</p>
    </footer>
</body>
</html>
